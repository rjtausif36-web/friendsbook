
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friendsbook</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #1c1e21;
    }
    header {
      background: #1877f2;
      color: white;
      padding: 18px;
      font-size: 27px;
      font-weight: bold;
    }
    main {
      max-width: 620px;
      margin: 24px auto;
      padding: 0 14px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 6px 0 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }
    textarea { min-height: 90px; }
    button {
      background: #1877f2;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 11px 17px;
      margin: 4px 2px;
      font-size: 15px;
    }
    .muted { color: #65676b; font-size: 13px; }
    .post-text { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header>Friendsbook</header>
  <main>
    <section class="card">
      <h2>বন্ধুদের সঙ্গে যুক্ত থাকো!</h2>
      <p>Share your thoughts. Connect with friends.</p>
    </section>

    <section class="card">
      <h3>Join Friendsbook / যোগ দাও</h3>
      <input id="email" type="email" placeholder="Email address">
      <input id="password" type="password" placeholder="Password">
      <button id="signupBtn">Sign up / নিবন্ধন</button>
      <button id="loginBtn">Login / লগইন</button>
      <p id="authMessage" class="muted"></p>
    </section>

    <section class="card">
      <h3>তোমার মনের কথা লেখো</h3>
      <textarea id="postInput" placeholder="কী ভাবছ?"></textarea>
      <button id="postBtn">পোস্ট তৈরি করো</button>
      <p id="notice" class="muted">Friendsbook ডেমো</p>
    </section>

    <h2>সাম্প্রতিক পোস্ট</h2>
    <div id="feed"></div>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const message = document.getElementById("authMessage");

    try {
      if (!window.FRIENDSBOOK_CONFIG ||
          !window.FRIENDSBOOK_CONFIG.SUPABASE_URL ||
          !window.FRIENDSBOOK_CONFIG.SUPABASE_PUBLISHABLE_KEY) {
        throw new Error("Supabase config.js-এ URL বা Publishable Key নেই।");
      }

      if (!window.supabase) {
        throw new Error("Supabase library লোড হয়নি।");
      }

      const supabaseClient = window.supabase.createClient(
        window.FRIENDSBOOK_CONFIG.SUPABASE_URL,
        window.FRIENDSBOOK_CONFIG.SUPABASE_PUBLISHABLE_KEY
      );

      document.getElementById("signupBtn").onclick = async () => {
        message.textContent = "অপেক্ষা করো...";
        try {
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          if (!email || !password) {
            throw new Error("ইমেইল ও পাসওয়ার্ড লেখো।");
          }
          const { error } = await supabaseClient.auth.signUp({ email, password });
          if (error) throw error;
          message.textContent = "নিবন্ধনের অনুরোধ সফল! ইমেইল যাচাই করো, যদি চাওয়া হয়।";
        } catch (e) {
          message.textContent = e.message;
        }
      };

      document.getElementById("loginBtn").onclick = async () => {
        message.textContent = "লগইন হচ্ছে...";
        try {
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          if (!email || !password) {
            throw new Error("ইমেইল ও পাসওয়ার্ড লেখো।");
          }
          const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          message.textContent = "Login successful!";
        } catch (e) {
          message.textContent = e.message;
        }
      };
    } catch (e) {
      message.textContent = "সংযোগ সমস্যা: " + e.message;
    }

    document.getElementById("postBtn").onclick = () => {
      const input = document.getElementById("postInput");
      const text = input.value.trim();
      const notice = document.getElementById("notice");
      if (!text) {
        notice.textContent = "আগে কিছু লেখো!";
        return;
      }
      const card = document.createElement("section");
      card.className = "card";
      const p = document.createElement("p");
      p.className = "post-text";
      p.textContent = text;
      card.appendChild(p);
      document.getElementById("feed").prepend(card);
      input.value = "";
      notice.textContent = "ডেমো পোস্ট যোগ হয়েছে!";
    };
  </script>
</body>
</html>
